upstream snaply_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name api.snaply.dev;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.snaply.dev;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/api.snaply.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.snaply.dev/privkey.pem;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request size limit
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 256;

    # Proxy to Uvicorn
    location / {
        proxy_pass http://snaply_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check (no logging)
    location /health {
        proxy_pass http://snaply_backend;
        access_log off;
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
    }
}
